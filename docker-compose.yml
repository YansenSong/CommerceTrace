services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: commerce_trace
      POSTGRES_USER: commerce_app
      POSTGRES_PASSWORD: commerce_app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce_app -d commerce_trace"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["commerce-trace", "init", "--profile", "${DATA_PROFILE:-test}", "--if-empty"]
    environment:
      COMMERCE_TRACE_DATABASE_URL: postgresql://commerce_app:commerce_app@postgres:5432/commerce_trace
      COMMERCE_TRACE_QUERY_DATABASE_URL: postgresql://commerce_reader:commerce_reader@postgres:5432/commerce_trace
      COMMERCE_TRACE_KNOWLEDGE_PATH: /app/knowledge
      COMMERCE_TRACE_CHROMA_PATH: /data/chroma
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - chroma_data:/data/chroma
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      COMMERCE_TRACE_ENVIRONMENT: production
      COMMERCE_TRACE_DATABASE_URL: postgresql://commerce_app:commerce_app@postgres:5432/commerce_trace
      COMMERCE_TRACE_QUERY_DATABASE_URL: postgresql://commerce_reader:commerce_reader@postgres:5432/commerce_trace
      COMMERCE_TRACE_LLM_MODE: ${LLM_MODE:-fake}
      COMMERCE_TRACE_OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      COMMERCE_TRACE_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COMMERCE_TRACE_OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      COMMERCE_TRACE_COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COMMERCE_TRACE_KNOWLEDGE_PATH: /app/knowledge
      COMMERCE_TRACE_CHROMA_PATH: /data/chroma
      COMMERCE_TRACE_EVAL_DATASET_PATH: /app/evals/datasets/mvp.yaml
    depends_on:
      backend-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data/chroma

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres_data:
  chroma_data:
