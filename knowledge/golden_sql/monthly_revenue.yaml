id: monthly_revenue
question: 每月销售额趋势
analysis_step: 确认总体变化
metric_versions:
  revenue: "1"
sql: |
  SELECT strftime('%Y-%m', ordered_at) AS month,
         SUM(total_amount) AS revenue
  FROM ecommerce.orders
  WHERE status IN ('paid', 'completed')
  GROUP BY 1
  ORDER BY 1
