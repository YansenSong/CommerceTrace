[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commerce-trace"
version = "0.1.0"
description = "Evidence-backed Chinese ecommerce data agent"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "langchain==1.3.14",
  "langchain-deepseek==1.1.0",
  "langgraph==1.2.10",
  "langgraph-checkpoint-sqlite==3.1.0",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyyaml==6.0.3",
  "sqlglot>=26.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
data = [
  "Faker>=33.0",
  "numpy>=2.0",
]

[dependency-groups]
dev = [
  "mypy>=1.15",
  "ruff>=0.9",
  "types-pyyaml==6.0.12.20260724",
]

[project.scripts]
commerce-trace = "commerce_trace.operations.cli:main_sync"

[tool.hatch.build.targets.wheel]
packages = ["src/commerce_trace"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["commerce_trace"]
warn_unused_ignores = false
